# Command bindings. install.sh appends these to your config.toml between
# `# >>> herdr-tmuxify >>>` and `# <<< herdr-tmuxify <<<`; leave that block's
# contents alone, since uninstall removes it whole. The comments here are
# documentation and are not copied.
#
# A `# requires: <table.key>` line names the scalar in keys.toml that frees
# this block's chord. install.sh adds the block only while that scalar is in
# effect, because otherwise the command would silently take the chord of an
# action you still expect to find there.
#
# Each block must stay on one line per key: install.sh copies blocks line by
# line, and a block ends at the first blank or comment line.

# tmux `prefix x` asks before killing a pane; herdr's close_pane does not, and
# has no setting that makes it. This popup asks. `herdr pane close` takes an
# explicit pane id rather than "the current pane", so the command asks the
# server for the focused one with `herdr api snapshot`. The prompt echoes that
# id and its working directory: if the popup were ever slow to update focus
# and this resolved a pane other than the one you meant, the mismatch is
# visible and declinable. Runs under `bash`, not `sh`: `read -n 1` takes one
# keypress without Enter, and that flag is a bashism. Only y/Y closes the pane;
# n, q and a bare Enter decline. Needs jq.
# requires: keys.close_pane
[[keys.command]]
key = "prefix+x"
type = "popup"
width = "50%"
height = "20%"
command = '''bash -c 'p=$(herdr api snapshot | jq -r .result.snapshot.focused_pane_id); c=$(herdr pane get "$p" | jq -r .result.pane.cwd); printf "Close pane %s (%s)? [y/N] " "$p" "$c"; read -n 1 -r a; echo; case "$a" in [yY]) herdr pane close "$p" ;; esac' '''

# tmux `prefix &` asks before killing a window; herdr's close_tab does not,
# and there is no tab-scoped confirm setting (ui.confirm_close guards only
# workspaces). Built the same way as the pane popup, and it also shows how many
# panes go with the tab, which tmux's own prompt does not.
# requires: keys.close_tab
[[keys.command]]
key = "prefix+ampersand"
type = "popup"
width = "50%"
height = "20%"
command = '''bash -c 't=$(herdr api snapshot | jq -r .result.snapshot.focused_tab_id); l=$(herdr tab get "$t" | jq -r .result.tab.label); n=$(herdr pane list | jq -r "[.result.panes[]|select(.tab_id==\"$t\")]|length"); printf "Close tab %s (%s panes)? [y/N] " "$l" "$n"; read -n 1 -r a; echo; case "$a" in [yY]) herdr tab close "$t" ;; esac' '''

# tmux `prefix q` is display-panes: numbers the panes, press one to jump. herdr
# has no such feature, so the display-panes plugin (plugins/display-panes)
# rebuilds it: a full-size popup repaints each pane with a big digit on it. 1-9
# focuses that pane; any other key, or 3 s of nothing, closes it. A zoomed tab
# is unzoomed while the numbers show and zoomed again unless another pane is
# picked. prefix+q was herdr's detach; keys.toml moves that to prefix+d.
# requires: keys.detach
[[keys.command]]
key = "prefix+q"
type = "plugin_action"
command = "herdr-tmuxify.display-panes.show"
description = "display panes"
