# herdr panes plugin: tmux's `prefix q` (display-panes), and tmux's
# prefix+h/j/k/l, which go back to the neighbour focused last.
#
# display-panes is a plugin rather than a plain `type = "popup"` keybinding
# because the frame must be built before the popup opens (see the header of
# display-panes.pl), and only a plugin can open a popup from a script: there
# is no API to open one with an arbitrary command.
#
# Commands are argv arrays run without a shell, and their working directory is
# this plugin directory, so the scripts resolve without a path.
id = "herdr-tmuxify.panes"
name = "Panes"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "tmux display-panes, and tmux's pane focus by direction"
platforms = ["macos", "linux"]

# Bound to prefix+q in config/commands.toml.
[[actions]]
id = "display-panes"
title = "Display panes"
command = ["perl", "display-panes.pl", "show"]

# Bound to prefix+h/j/k/l in config/commands.toml: to the neighbour focused
# last.
[[actions]]
id = "focus-left"
title = "Focus pane left"
command = ["perl", "focus.pl", "left"]

[[actions]]
id = "focus-down"
title = "Focus pane down"
command = ["perl", "focus.pl", "down"]

[[actions]]
id = "focus-up"
title = "Focus pane up"
command = ["perl", "focus.pl", "up"]

[[actions]]
id = "focus-right"
title = "Focus pane right"
command = ["perl", "focus.pl", "right"]

# Records every focus change for prefix+h/j/k/l, so focus moved by the mouse,
# prefix+q, prefix+; and the rest counts too.
[[events]]
on = "pane.focused"
command = ["perl", "focus.pl", "focused"]

# The popup is opened only by the display-panes action. 100% covers exactly
# the tab's pane area, so the repainted panes land on the cells they occupy
# underneath.
#
# The title becomes the popup's border title, and an empty one turns into
# "popup" (src/server/client_shell.rs). A zero-width space survives herdr's
# trim (it is not whitespace) and draws nothing.
#
# The command prints the prepared frame before perl starts, because the
# popup's first render must already contain it; cat is out in ~3 ms. stty
# goes first: a key typed before perl gets to its own raw-mode switch was
# held in the line buffer and lost, or echoed onto the frame.
[[panes]]
id = "picker"
title = "​"
placement = "popup"
width = "100%"
height = "100%"
command = ["/bin/sh", "-c", "stty -icanon -echo min 1 time 0; cat \"$DISPLAY_PANES_STATE/frame\"; exec perl display-panes.pl pick"]
